<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefa</title>
</head>

<body>
    <header>
         <h1>Lista de Tarefas</h1>
        <p>Organize atividades e acompanhe suas conclusões.</p>
        <a href="">◈Laboratório Possibilidades</a>
        <a href="">Ver os três projetos</a>
    </header>

    <div class="lulu">

        <main class="loc">
            <div class="rut">
            <div class="rut">
                <span>Tarefas</span>
                <strong id="t-total">0</strong>
            </div>

             <div class="rut">
                <span>Concluídas</span>
                <strong id="t-feit">0</strong>
            </div>

             <div class="rut">
                <span>Pendentes</span>
                <strong id="t-pend">0</strong>
            </div>
        </div>
        <div class="luc">
            <h2>Nova Tarefa</h2>
            <section class="tuctuc">
               <form class="blue" id="truc-form">
                <div class="fiel">
                     <label for="tarefa">Descrição da Tarefa</label>
                <input type="text" id="tarefa" placeholder="EX:. Estudar a historia do tango">
                </div>
                  <div class="fiel">
                     <label for="prior">Prioridade</label>
                     <select name="pri" id="prior">
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                     </select>
                </div>
            </form>
            </section>
            <section class="tactac">
                <div>
                  <h2>Minhas Tarefas</h2>
                <select name="ta" id="filtro" class="love">
                    <option value="todas">Todas</option>
                    <option value="pend">Pendentes</option>
                    <option value="concl">Concluída</option>
                </select>
                </div>
                <p class="intro">Marque as atividades realizadas ou exclua tarefas desnecessárias.</p>
                    <div id="lista" class="itens"></div>
            </section>
           
        </div>
        </main>
         
    </div>


</body>

</html>
