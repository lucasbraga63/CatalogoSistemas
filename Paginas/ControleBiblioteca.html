<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/ControleBiblioteca.css">
    <title>Controle de Biblioteca</title>
</head>

<body>
    <main>
        <div class="containerTitulo">
            <h1>Controle de Biblioteca</h1>
            <p>Cadastre, empreste e devolva livros.</p>
        </div>
        <div class="cardsInfoContainer">
            <div class="cardInfo">
                <h6>Livros cadastrados</h6>
                <h1>0</h1>
            </div>
            <div class="cardInfo">
                <h6>Disponíveis</h6>
                <h1>0</h1>
            </div>
            <div class="cardInfo">
                <h6>Emprestados</h6>
                <h1>0</h1>
            </div>
        </div>
        <div class="cardsManageContainer">


            <div class="cardManage" id="form">
                <h2>Cadastrar livro</h2>
                <p>Adicione títulos ao acervo da biblioteca.</p>

                <div class="inputContainer">
                    <label for="titulo">Titulo</label>
                    <input type="text" id="titulo" placeholder="Titulo do livro">
                </div>

                <div class="inputContainer">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" placeholder="Autor do livro">
                </div>

                <div class="selectContainer">
                    <label for="categoria">Categoria</label>
                    <select name="categoria" id="categoria">
                        <option value="">sedfvsd</option>
                    </select>
                </div>
                <button type="button">Cadastrar livro</button>
            </div>
        </div>
    </main>
</body>

</html>
