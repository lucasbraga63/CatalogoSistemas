<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/ControleBiblioteca.css">
    <script src="../JS/ControleBiblioteca.js" defer></script>
    <title>Controle de Biblioteca</title>
</head>

<body>
    <main>
        <div class="containerTitulo">
            <h1>Controle de Biblioteca</h1>
            <p>Cadastre, empreste e devolva livros.</p>
        </div>
        <div class="cardsInfoContainer">
            <div class="cardInfo">
                <h6>Livros cadastrados</h6>
                <h1 id="numLivrosCastrados">0</h1>
            </div>
            <div class="cardInfo">
                <h6>Disponíveis</h6>
                <h1 id="numDisponiveis">0</h1>
            </div>
            <div class="cardInfo">
                <h6>Emprestados</h6>
                <h1 id="numEmprestados">0</h1>
            </div>
        </div>
        <div class="cardsManageContainer">


            <div class="cardManage" id="form">
                <h2>Cadastrar livro</h2>
                <p>Adicione títulos ao acervo da biblioteca.</p>

                <div class="inputContainer">
                    <label for="inputTitulo">Titulo</label>
                    <input type="text" id="inputTitulo" placeholder="Titulo do livro">
                </div>

                <div class="inputContainer">
                    <label for="inputAutor">Autor</label>
                    <input type="text" id="inputAutor" placeholder="Autor do livro">
                </div>

                <div class="selectContainer">
                    <label for="selectCategoria">Categoria</label>
                    <select name="categoria" id="selectCategoria">
                        <option value="Progamacao">Progamação</option>
                        <option value="Rede">Rede</option>
                        <option value="Design">Design</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <button type="button" onclick="addBook()">Cadastrar livro</button>
            </div>
            <div class="cardShow">
                <div class="cardShowTop">
                    <h2>Acervo</h2>
                    <input type="text" id="pesquisa" placeholder="Pesquisar título ou autor">
                </div>
                <p>Use os botões de empréstimo e devolução para atualizar os registros.</p>
                <div class="showSearch">
                    <p>Nenhum livro encontrado.</p>
                    <!-- <div class="cardLivro">
                        <div class="cardShowTop">
                            <div class="showSearchInfo">
                                <h2>titulo</h2>
                                <p>Autor • classe</p>
                                <p>Com: nome • Devolver até 00/00/0000</p>

                            </div>
                            <p id="statusTrue">Disponivel</p>
                             <p id="statusFalse">Emprestado</p>
                        </div>
                        <button>deletar</button>
                        <button>Emprestar</button>
                        <button>registar devolucao</button>
                    </div> -->
                </div>
            </div>
        </div>
    </main>
</body>

</html>
